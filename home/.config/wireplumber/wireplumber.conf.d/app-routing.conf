# Roteamento fixo por app: Firefox -> TV (HDMI), Chrome -> fone Bluetooth.
# Se a saida alvo nao existir, o WirePlumber cai na saida padrao.
stream.rules = [
  {
    matches = [ { media.class = "Stream/Output/Audio", application.process.binary = "firefox" } ]
    actions = { update-props = { target.object = "alsa_output.pci-0000_00_1f.3.hdmi-stereo" } }
  }
  {
    matches = [ { media.class = "Stream/Output/Audio", application.process.binary = "chrome" } ]
    actions = { update-props = { target.object = "bluez_output.05_E8_8D_19_3E_85.1" } }
  }
]
