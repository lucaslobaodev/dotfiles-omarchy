# Roteamento fixo por app (clientes Pulse): Firefox -> TV (HDMI), Chrome -> fone Bluetooth.
pulse.rules = [
  {
    matches = [ { application.process.binary = "firefox" } ]
    actions = { update-props = { target.object = "alsa_output.pci-0000_00_1f.3.hdmi-stereo" } }
  }
  {
    matches = [ { application.process.binary = "chrome" } ]
    actions = { update-props = { target.object = "bluez_output.05_E8_8D_19_3E_85.1" } }
  }
]
